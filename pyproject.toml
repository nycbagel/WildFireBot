[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wildfirebot"
version = "0.1.0"
description = "Estimate relative wildfire smoke exposure from satellite detections and forecast wind."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "WildFireBot contributors"}]
keywords = ["wildfire", "smoke", "aqi", "firms", "air-quality"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.3",
    "pandas>=2.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.8",
]

[project.scripts]
wildfirebot = "wildfirebot.cli:main"
aqi-smoke = "wildfirebot.cli:main"
wildfirebot-mcp = "wildfirebot.mcp:main"
wildfirebot-xbot = "wildfirebot.xbot.bot:main"

[project.urls]
Homepage = "https://github.com/nycbagel/WildFireBot"
Documentation = "https://github.com/nycbagel/WildFireBot/blob/main/docs/methodology.md"

[tool.hatch.build.targets.wheel]
packages = ["src/wildfirebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns wrapping. E501 fights it and is not auto-fixed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
