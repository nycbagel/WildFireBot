name: X mention bot

# Manual by default. The bot only answers posts that @mention it, and it is a dry run
# until the repository variable WFB_X_DRY_RUN is set to 0. To poll on a timer, uncomment
# the schedule (GitHub may delay or skip scheduled runs, and the shortest interval is 5 minutes).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/15 * * * *"

concurrency:
  group: xbot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      # The state file (since_id and replied ids) must survive between runs. Cache keys are
      # immutable, so each run saves under its own id and restores the newest earlier one.
      - uses: actions/cache@v4
        with:
          path: .xbot_state.json*
          key: xbot-state-${{ github.run_id }}
          restore-keys: xbot-state-
      - name: Poll mentions once
        env:
          WFB_X_DRY_RUN: ${{ vars.WFB_X_DRY_RUN || '1' }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_BOT_USER_ID: ${{ vars.X_BOT_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m wildfirebot.xbot --once
